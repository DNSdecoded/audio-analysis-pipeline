<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAFA" />
    <script>
      // Pre-paint theme resolution (mirrors src/lib/theme.ts) — avoids a flash of the wrong theme.
      (function () {
        var pref = 'system';
        try { var v = localStorage.getItem('aap_theme'); if (v === 'light' || v === 'dark' || v === 'system') pref = v; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#121214' : '#FAFAFA');
      })();
    </script>
    <meta name="description" content="Professional web-based audio analysis, comparison and production QC dashboard" />
    <title>Audio Analysis Pipeline — measurement, comparison &amp; QC</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
